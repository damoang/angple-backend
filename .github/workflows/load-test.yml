name: Load Test

# =============================================================================
# Locust 부하 테스트
#
# 현재: 단일 노드 실행
# 분산 테스트 전환 시 코드 변경 없이 실행 방식만 변경하면 됨:
#
#   # Master 노드
#   locust -f locustfile.py --master --expect-workers=N
#
#   # Worker 노드들 (동일한 locustfile.py 사용)
#   locust -f locustfile.py --worker --master-host=<master-ip>
#
# CI에서 분산 테스트 예시:
#   locust --master --expect-workers=3 &
#   locust --worker --master-host=127.0.0.1 &
#   locust --worker --master-host=127.0.0.1 &
#   locust --worker --master-host=127.0.0.1 &
#   wait
# =============================================================================

on:
  # 예약 실행은 껐다(2026-10-12): 시드 100건짜리 로컬 DB 30초라 운영 성능 정보가 거의 없고, 초기화가 깨진 채 9개월 빨강이었다.
  # 수동 실행 + 개발용 DB 초기화 스크립트·compose·부하 시나리오를 바꾸는 PR 에서 돌린다.
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/load-test.yml'
      - '.docker/mysql/init/**'
      - 'docker-compose.dev.yml'
      - 'tests/load/**'

# 환경변수로 설정 가능 (Repository Settings > Secrets and variables > Actions)
# 설정하지 않으면 기본값 사용
env:
  LOAD_TEST_USERS: ${{ vars.LOAD_TEST_USERS || '50' }}
  LOAD_TEST_SPAWN_RATE: ${{ vars.LOAD_TEST_SPAWN_RATE || '10' }}
  LOAD_TEST_DURATION: ${{ vars.LOAD_TEST_DURATION || '30s' }}

jobs:
  load-test:
    name: Locust Load Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install locust
      run: pip install -r tests/load/requirements.txt

    - name: Start all services
      run: make dev-docker-rebuild

    - name: Wait for API to be healthy
      run: |
        echo "Waiting for all services to be ready..."
        for i in {1..90}; do
          if curl -s http://localhost:8081/health | grep -q "ok"; then
            echo "API is healthy!"
            exit 0
          fi
          echo "Waiting for API... ($i/90)"
          sleep 2
        done
        echo "Services failed to start"
        docker compose -f docker-compose.dev.yml logs
        exit 1

    - name: Run load test
      run: |
        echo "Running load test with: users=$LOAD_TEST_USERS, spawn_rate=$LOAD_TEST_SPAWN_RATE, duration=$LOAD_TEST_DURATION"

        locust -f tests/load/locustfile.py \
          --host=http://localhost:8081 \
          --users $LOAD_TEST_USERS \
          --spawn-rate $LOAD_TEST_SPAWN_RATE \
          --run-time $LOAD_TEST_DURATION \
          --headless \
          --html=load-test-report.html \
          --csv=load-test-results

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: load-test-results
        path: |
          load-test-report.html
          load-test-results*.csv

    - name: Check failure rate
      run: |
        # Extract failure rate from CSV
        if [ -f load-test-results_stats.csv ]; then
          FAIL_RATE=$(tail -1 load-test-results_stats.csv | cut -d',' -f5)
          echo "Failure rate: ${FAIL_RATE}%"
          # Fail if error rate > 1%
          if [ $(echo "$FAIL_RATE > 1" | bc -l) -eq 1 ]; then
            echo "Error rate too high: ${FAIL_RATE}%"
            exit 1
          fi
        fi

    # 컨테이너가 죽으면 원인이 로그에만 남는다 — 실패 시 MySQL·API 로그를 남긴다
    - name: Dump container logs on failure
      if: failure()
      run: |
        docker compose -f docker-compose.dev.yml ps -a || true
        docker compose -f docker-compose.dev.yml logs --no-color --tail 200 mysql || true
        docker compose -f docker-compose.dev.yml logs --no-color --tail 100 api || true

    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.dev.yml down -v || true
