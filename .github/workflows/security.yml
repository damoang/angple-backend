name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 매주 월요일 09:00 UTC (한국시간 18:00)
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write  # GitHub Security 탭에 결과 업로드

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./... || true

    - name: Run govulncheck (SARIF)
      run: govulncheck -format=sarif ./... > govulncheck.sarif || true

    - name: Upload govulncheck SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: govulncheck.sarif
        category: govulncheck

  gosec:
    name: Go Security Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4

    - name: Run gosec
      run: gosec -no-fail -fmt sarif -out gosec.sarif ./...

    - name: Fix SARIF for CodeQL compatibility
      run: |
        jq '(.. | .relationships? // empty) |= map(select(. != null))' gosec.sarif > gosec-fixed.sarif
        mv gosec-fixed.sarif gosec.sarif

    - name: Upload gosec SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: gosec.sarif
        category: gosec

  # 시크릿 스캐닝 - Gitleaks (MIT 라이선스 CLI 직접 실행)
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Gitleaks
      run: |
        set -euo pipefail
        # ⛔ 예전 방식 `sed 's/.*"v\(.*\)".*/\1/'` 은 탐욕적 매칭이라 응답 한 줄을 통째로
        #    삼킨다. 2026-08-05 GitHub 릴리스 API 응답에 필드가 늘면서 실제로 깨졌고
        #    (같은 잡이 06:57 까지는 통과, 10:35 부터 실패) 백엔드 PR 전체가 막혔다.
        #    버전 대신 JSON 뒷부분이 통째로 들어가 URL 이 망가진다:
        #      GITLEAKS_VERSION='8.30.1","draft":false,...'  → curl: (3) bad range specification
        #    `grep -oP` 로 따옴표 안쪽만 정확히 집는다.
        GITLEAKS_VERSION=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
          | grep -oP '"tag_name"\s*:\s*"v?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        # 버전을 못 뽑으면 조용히 넘어가지 말고 여기서 죽는다 — 스캔이 안 돈 채 초록이 되면
        # '검사했다'는 착각만 남는다.
        if [ -z "${GITLEAKS_VERSION}" ]; then
          echo "::error::gitleaks 최신 버전을 확인하지 못했습니다"
          exit 1
        fi
        echo "gitleaks v${GITLEAKS_VERSION}"
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks

    - name: Run Gitleaks
      run: gitleaks detect --source=. -v
